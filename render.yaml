# One-click deployment of the complete RetrainWise app on Render (Blueprint).
# Render builds the Dockerfile, mounts a persistent disk at /data and asks for
# the values marked `sync: false` when you create the Blueprint.
services:
  - type: web
    name: retrainwise
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter            # persistent disks need a paid instance
    healthCheckPath: /api/health
    disk:
      name: retrainwise-data
      mountPath: /data
      sizeGB: 5
    envVars:
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_URL          # public URL, e.g. https://retrainwise.onrender.com
        sync: false
      - key: SESSION_MAX_AGE_DAYS
        value: "7"
      # Email: SMTP (any address) and/or Resend (needs a verified domain)
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: AUTH_RESEND_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      # Optional: hosted open-source models for the agent
      - key: LLM_API_KEY
        sync: false
